<!DOCTYPE html>
<html lang="sq">
<head>

<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c27;
  --border: rgba(255,255,255,0.07);
  --accent: #c8f55a;
  --accent2: #7c6eff;
  --text: #f0f0f5;
  --text-muted: #7a7a99;
  --radius: 16px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── BG AMBIENT ─── */
body::before {
  content: '';
  position: fixed;
  top: -30%;
  left: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(124,110,255,0.12) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}
body::after {
  content: '';
  position: fixed;
  bottom: -20%;
  right: -10%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(200,245,90,0.07) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ─── NAV ─── */
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 18px 32px;
  background: rgba(10,10,15,0.7);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

#adminNavBtn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}
#adminNavBtn:hover { border-color: var(--accent); color: var(--accent); }

/* ─── PAGES ─── */
.page { display: none; position: relative; z-index: 1; }
.page.active { display: block; }

/* ─── HOME ─── */
#homePage {
  max-width: 1100px;
  margin: 0 auto;
  padding: 60px 24px;
}

.hero {
  text-align: center;
  margin-bottom: 64px;
  animation: fadeUp 0.6s ease both;
}

.hero h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(2.8rem, 6vw, 5rem);
  line-height: 1.1;
  letter-spacing: -1px;
  background: linear-gradient(135deg, #f0f0f5 40%, #7c6eff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 16px;
}

.hero p {
  color: var(--text-muted);
  font-size: 1.1rem;
  font-weight: 300;
}

/* ─── CATEGORIES ─── */
.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 24px;
}

.categories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  margin-bottom: 48px;
}

.cat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
  animation: fadeUp 0.5s ease both;
}

.cat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.3s ease;
}
.cat-card:hover::before { transform: scaleX(1); }
.cat-card:hover {
  border-color: rgba(255,255,255,0.15);
  transform: translateY(-3px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

.cat-icon {
  font-size: 2rem;
  margin-bottom: 14px;
}

.cat-name {
  font-size: 1.15rem;
  font-weight: 600;
  margin-bottom: 6px;
}

.cat-count {
  display: none;
}

.cat-arrow {
  position: absolute;
  top: 24px; right: 24px;
  color: var(--text-muted);
  font-size: 1.2rem;
  transition: transform 0.2s, color 0.2s;
}
.cat-card:hover .cat-arrow { transform: translate(3px,-3px); color: var(--accent); }

/* ─── PRODUCTS PAGE ─── */
#productsPage {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 24px;
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  margin-bottom: 36px;
  transition: all 0.2s;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }

.products-header {
  margin-bottom: 36px;
}

.products-header h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 2.2rem;
  margin-bottom: 6px;
}

.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}

.product-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: all 0.25s ease;
  animation: fadeUp 0.4s ease both;
  cursor: pointer;
}
.product-card:hover {
  border-color: rgba(200,245,90,0.2);
  transform: translateY(-4px);
  box-shadow: 0 24px 48px rgba(0,0,0,0.4);
}

.product-img {
  width: 100%;
  aspect-ratio: 16/10;
  object-fit: cover;
  background: var(--surface2);
  display: block;
}

.product-img-placeholder {
  width: 100%;
  aspect-ratio: 16/10;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 2.5rem;
}

.product-body {
  padding: 20px;
}

.product-name {
  font-weight: 600;
  font-size: 1rem;
  margin-bottom: 14px;
  line-height: 1.4;
}

.product-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--accent);
  color: #0a0a0f;
  font-weight: 600;
  font-size: 0.85rem;
  padding: 10px 18px;
  border-radius: 8px;
  text-decoration: none;
  transition: all 0.2s;
  width: 100%;
  justify-content: center;
}
.product-link:hover { background: #d4ff6a; transform: scale(1.02); }

/* ─── EMPTY ─── */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}
.empty-state .empty-icon { font-size: 3rem; margin-bottom: 16px; }
.empty-state h3 { font-size: 1.2rem; margin-bottom: 8px; color: var(--text); }

/* ─── ADMIN PAGE ─── */
#adminPage {
  display: none;
  position: fixed;
  top: 0; right: 0;
  width: min(460px, 100vw);
  height: 100vh;
  background: var(--surface);
  border-left: 1px solid var(--border);
  z-index: 1000;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: -20px 0 60px rgba(0,0,0,0.5);
}
#adminPage.open {
  display: block;
  transform: translateX(0);
}

.admin-header {
  padding: 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 10;
}

.admin-header h2 {
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: -0.3px;
}

#closeAdmin {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 1.4rem;
  line-height: 1;
  padding: 4px;
  transition: color 0.2s;
}
#closeAdmin:hover { color: var(--text); }

.admin-body { padding: 24px; }

.admin-tabs {
  display: flex;
  gap: 4px;
  background: var(--surface2);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 28px;
}

.tab-btn {
  flex: 1;
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 9px 8px;
  border-radius: 7px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
}
.tab-btn.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ─── FORM ─── */
.form-group { margin-bottom: 18px; }

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 8px;
}

input[type="text"], input[type="url"], input[type="password"], select, textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent2); }
select option { background: var(--surface2); }
textarea { resize: vertical; min-height: 70px; }

.btn {
  width: 100%;
  padding: 13px;
  border-radius: var(--radius-sm);
  border: none;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.2s;
}

.btn-primary {
  background: var(--accent);
  color: #0a0a0f;
}
.btn-primary:hover { background: #d4ff6a; transform: scale(1.01); }

.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: rgba(255,255,255,0.2); }

.btn-danger {
  background: rgba(255,60,60,0.15);
  color: #ff6060;
  border: 1px solid rgba(255,60,60,0.2);
}
.btn-danger:hover { background: rgba(255,60,60,0.25); }

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 24px 0;
}

/* ─── ITEM LIST ─── */
.item-list { display: flex; flex-direction: column; gap: 10px; }

.list-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.list-item-info { flex: 1; min-width: 0; }
.list-item-name { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.list-item-actions { display: flex; gap: 6px; flex-shrink: 0; }

.icon-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  width: 32px;
  height: 32px;
  border-radius: 7px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all 0.2s;
}
.icon-btn:hover { background: var(--surface); color: var(--text); }
.icon-btn.del:hover { border-color: rgba(255,60,60,0.4); color: #ff6060; background: rgba(255,60,60,0.1); }
.icon-btn.edt:hover { border-color: rgba(200,245,90,0.4); color: var(--accent); }

/* ─── LOGIN ─── */
#loginOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  display: none;
}
#loginOverlay.show { display: flex; }

.login-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 32px;
  width: min(380px, 90vw);
  animation: fadeUp 0.3s ease;
}

.login-box h3 {
  font-family: 'DM Serif Display', serif;
  font-size: 1.6rem;
  margin-bottom: 6px;
}
.login-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

#loginError {
  background: rgba(255,60,60,0.12);
  border: 1px solid rgba(255,60,60,0.2);
  color: #ff8080;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}

/* ─── MODAL ─── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  z-index: 3000;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.show { display: flex; }

.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  width: min(420px, 90vw);
  animation: fadeUp 0.3s ease;
}
.modal-box h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; }

.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions .btn { flex: 1; }

/* ─── TOAST ─── */
#toast {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 13px 24px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  z-index: 9999;
  opacity: 0;
  transition: all 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
#toast.success { border-color: rgba(200,245,90,0.3); }
#toast.error { border-color: rgba(255,60,60,0.3); color: #ff8080; }

/* ─── OVERLAY BACKDROP ─── */
#backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 999;
}
#backdrop.show { display: block; }

/* ─── LOADING ─── */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 60px;
}
.spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

/* ─── ANIMATIONS ─── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ─── EDIT HIGHLIGHT ─── */
.editing {
  border-color: var(--accent) !important;
  box-shadow: 0 0 0 2px rgba(200,245,90,0.15);
}

/* ─── ANALYTICS ─── */
.analytics-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.analytics-rank {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}
.analytics-rank.top { color: var(--accent); }

.analytics-info { flex: 1; min-width: 0; }
.analytics-name { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.analytics-cat { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

.analytics-bar-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 7px;
}
.analytics-bar-bg {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.analytics-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 2px;
  transition: width 0.5s ease;
}
.analytics-clicks {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  flex-shrink: 0;
  min-width: 36px;
  text-align: right;
}
.analytics-clicks span {
  font-size: 10px;
  font-weight: 400;
  color: var(--text-muted);
}

.analytics-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 13px;
}

/* ─── RESPONSIVE ─── */
@media (max-width: 600px) {
  .categories-grid { grid-template-columns: 1fr; }
  .products-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <button id="adminNavBtn">⚙ Admin</button>
</nav>

<!-- HOME PAGE -->
<div id="homePage" class="page active">
  <div class="hero">
    <h1>Discover & Shop</h1>
    <p>Curated deals across every category</p>
  </div>
  <p class="section-label">Browse Categories</p>
  <div id="categoriesGrid" class="categories-grid">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- PRODUCTS PAGE -->
<div id="productsPage" class="page">
  <button class="back-btn" id="backBtn">← Back</button>
  <div class="products-header">
    <h2 id="catPageTitle">Category</h2>
    <p class="section-label" id="catPageCount"></p>
  </div>
  <div id="productsGrid" class="products-grid">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<!-- BACKDROP -->
<div id="backdrop"></div>

<!-- ADMIN PANEL -->
<div id="adminPage">
  <div class="admin-header">
    <h2>Admin Panel</h2>
    <button id="closeAdmin">✕</button>
  </div>
  <div class="admin-body">
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="cats">Categories</button>
      <button class="tab-btn" data-tab="products">Products</button>
      <button class="tab-btn" data-tab="analytics">📊</button>
    </div>

    <!-- CATEGORIES TAB -->
    <div class="tab-content active" id="tab-cats">
      <div class="form-group">
        <label>Category Name</label>
        <input type="text" id="catName" placeholder="e.g. Electronics">
      </div>
      <div class="form-group">
        <label>Emoji Icon</label>
        <input type="text" id="catEmoji" placeholder="e.g. 📱" maxlength="4">
      </div>
      <button class="btn btn-primary" id="saveCatBtn">Add Category</button>
      <hr class="divider">
      <p class="section-label">Existing Categories</p>
      <div id="catList" class="item-list">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>

    <!-- PRODUCTS TAB -->
    <div class="tab-content" id="tab-products">
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="prodName" placeholder="Product name">
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="url" id="prodImgUrl" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Affiliate Link</label>
        <input type="url" id="prodLink" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="prodCat">
          <option value="">— Select category —</option>
        </select>
      </div>
      <button class="btn btn-primary" id="saveProdBtn">Add Product</button>
      <hr class="divider">
      <p class="section-label">Existing Products</p>
      <div id="prodList" class="item-list">
        <div class="loading"><div class="spinner"></div></div>
      </div>
    </div>
    <!-- ANALYTICS TAB -->
    <div class="tab-content" id="tab-analytics">
      <p class="section-label">Click Tracking</p>
      <div id="analyticsList" class="item-list">
        <div class="loading"><div class="spinner"></div></div>
      </div>
      <hr class="divider">
      <button class="btn btn-danger" id="resetClicksBtn" style="margin-top:4px;">Reset All Clicks</button>
    </div>

  </div>
</div>

<!-- LOGIN OVERLAY -->
<div id="loginOverlay">
  <div class="login-box">
    <h3>Admin Access</h3>
    <p>Enter password to continue</p>
    <div id="loginError">Incorrect password. Try again.</div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="passwordInput" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" id="loginBtn">Enter Panel</button>
    <button class="btn btn-secondary" style="margin-top:10px;" id="cancelLoginBtn">Cancel</button>
  </div>
</div>

<!-- EDIT CATEGORY MODAL -->
<div class="modal-overlay" id="editCatModal">
  <div class="modal-box">
    <h3>Edit Category</h3>
    <input type="hidden" id="editCatId">
    <div class="form-group">
      <label>Category Name</label>
      <input type="text" id="editCatName">
    </div>
    <div class="form-group">
      <label>Emoji Icon</label>
      <input type="text" id="editCatEmoji" maxlength="4">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelEditCat">Cancel</button>
      <button class="btn btn-primary" id="saveEditCat">Save</button>
    </div>
  </div>
</div>

<!-- EDIT PRODUCT MODAL -->
<div class="modal-overlay" id="editProdModal">
  <div class="modal-box">
    <h3>Edit Product</h3>
    <input type="hidden" id="editProdId">
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="editProdName">
    </div>
    <div class="form-group">
      <label>Image URL</label>
      <input type="url" id="editProdImgUrl">
    </div>
    <div class="form-group">
      <label>Affiliate Link</label>
      <input type="url" id="editProdLink">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="editProdCat"></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelEditProd">Cancel</button>
      <button class="btn btn-primary" id="saveEditProd">Save</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
const ADMIN_PASSWORD = "bestea2024";

// ── STATE ──
let isLoggedIn = false;
let allCategories = {};
let allProducts = {};
let allClicks = {};
let currentCatId = null;

// ── UTILS ──
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => t.className = '', 2800);
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── NAV ──
document.getElementById('adminNavBtn').addEventListener('click', () => {
  if (!isLoggedIn) {
    document.getElementById('loginOverlay').classList.add('show');
    document.getElementById('passwordInput').value = '';
    document.getElementById('loginError').style.display = 'none';
    setTimeout(() => document.getElementById('passwordInput').focus(), 100);
  } else {
    openAdmin();
  }
});

// ── LOGIN ──
function doLogin() {
  const pw = document.getElementById('passwordInput').value;
  if (pw === ADMIN_PASSWORD) {
    isLoggedIn = true;
    document.getElementById('loginOverlay').classList.remove('show');
    document.getElementById('loginError').style.display = 'none';
    openAdmin();
  } else {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').focus();
  }
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('passwordInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('cancelLoginBtn').addEventListener('click', () => {
  document.getElementById('loginOverlay').classList.remove('show');
});

// ── ADMIN OPEN/CLOSE ──
function openAdmin() {
  document.getElementById('adminPage').style.display = 'block';
  setTimeout(() => document.getElementById('adminPage').classList.add('open'), 10);
  document.getElementById('backdrop').classList.add('show');
  renderAdminCats();
  renderAdminProds();
  populateCatSelects();
  renderAnalytics();
}

function closeAdmin() {
  document.getElementById('adminPage').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
  setTimeout(() => document.getElementById('adminPage').style.display = 'none', 400);
}

document.getElementById('closeAdmin').addEventListener('click', closeAdmin);
document.getElementById('backdrop').addEventListener('click', closeAdmin);

// ── TABS ──
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// ── FIREBASE READY ──
document.addEventListener('firebaseReady', () => {
  listenCategories();
  listenProducts();
  listenClicks();
});

// ── LISTEN CATEGORIES ──
function listenCategories() {
  const r = window._ref(window._db, 'categories');
  window._onValue(r, snap => {
    allCategories = snap.val() || {};
    renderHomeCategories();
    renderAdminCats();
    populateCatSelects();
    if (currentCatId) renderProductsPage(currentCatId);
  });
}

// ── LISTEN PRODUCTS ──
function listenProducts() {
  const r = window._ref(window._db, 'products');
  window._onValue(r, snap => {
    allProducts = snap.val() || {};
    renderAdminProds();
    if (currentCatId) renderProductsPage(currentCatId);
  });
}

// ── LISTEN CLICKS ──
function listenClicks() {
  const r = window._ref(window._db, 'clicks');
  window._onValue(r, snap => {
    allClicks = snap.val() || {};
    renderAnalytics();
  });
}
function renderHomeCategories() {
  const grid = document.getElementById('categoriesGrid');
  const cats = Object.entries(allCategories);

  // sort by timestamp DESC (latest first)
  cats.sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

  if (cats.length === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📂</div><h3>No categories yet</h3><p>Add some from the admin panel</p></div>`;
    return;
  }

  grid.innerHTML = cats.map(([id, cat], i) => {
    const count = Object.values(allProducts).filter(p => p.categoryId === id).length;
    return `<div class="cat-card" style="animation-delay:${i * 0.06}s" onclick="goToCategory('${id}')">
      <div class="cat-icon">${cat.emoji || '📦'}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-count">${count} product${count !== 1 ? 's' : ''}</div>
      <div class="cat-arrow">→</div>
    </div>`;
  }).join('');
}

// ── GO TO CATEGORY ──
function goToCategory(catId) {
  currentCatId = catId;
  renderProductsPage(catId);
  showPage('productsPage');
}

function renderProductsPage(catId) {
  const cat = allCategories[catId];
  if (!cat) return;

  document.getElementById('catPageTitle').textContent = (cat.emoji || '') + ' ' + cat.name;

  const prods = Object.entries(allProducts).filter(([, p]) => p.categoryId === catId);
  // sort by timestamp DESC
  prods.sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

  const count = prods.length;
  document.getElementById('catPageCount').textContent = `${count} product${count !== 1 ? 's' : ''}`;

  const grid = document.getElementById('productsGrid');
  if (count === 0) {
    grid.innerHTML = `<div class="empty-state"><div class="empty-icon">🛒</div><h3>No products yet</h3><p>Add products to this category</p></div>`;
    return;
  }

  grid.innerHTML = prods.map(([id, p], i) => `
    <div class="product-card" style="animation-delay:${i * 0.05}s">
      ${p.imageUrl
        ? `<img class="product-img" src="${p.imageUrl}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="product-img-placeholder" style="${p.imageUrl ? 'display:none' : ''}">📦</div>
      <div class="product-body">
        <div class="product-name">${p.name}</div>
        <a class="product-link" href="${p.affiliateUrl}" target="_blank" rel="noopener" onclick="trackClick('${id}')">
          View Deal ↗
        </a>
      </div>
    </div>
  `).join('');
}

document.getElementById('backBtn').addEventListener('click', () => {
  currentCatId = null;
  showPage('homePage');
});

// ── ADD CATEGORY ──
document.getElementById('saveCatBtn').addEventListener('click', async () => {
  const name = document.getElementById('catName').value.trim();
  const emoji = document.getElementById('catEmoji').value.trim();
  const btn = document.getElementById('saveCatBtn');

  if (!name) { showToast('Enter a category name', 'error'); return; }

  const editId = btn.dataset.editId;

  if (editId) {
    // editing
    await window._update(window._ref(window._db, 'categories/' + editId), { name, emoji });
    showToast('Category updated ✓');
    btn.textContent = 'Add Category';
    delete btn.dataset.editId;
    btn.classList.remove('editing');
  } else {
    const newRef = window._push(window._ref(window._db, 'categories'));
    await window._set(newRef, { name, emoji, createdAt: Date.now() });
    showToast('Category added ✓');
  }

  document.getElementById('catName').value = '';
  document.getElementById('catEmoji').value = '';
});

// ── ADD PRODUCT ──
document.getElementById('saveProdBtn').addEventListener('click', async () => {
  const name = document.getElementById('prodName').value.trim();
  const imageUrl = document.getElementById('prodImgUrl').value.trim();
  const affiliateUrl = document.getElementById('prodLink').value.trim();
  const categoryId = document.getElementById('prodCat').value;
  const btn = document.getElementById('saveProdBtn');

  if (!name) { showToast('Enter product name', 'error'); return; }
  if (!affiliateUrl) { showToast('Enter affiliate URL', 'error'); return; }
  if (!categoryId) { showToast('Select a category', 'error'); return; }

  const editId = btn.dataset.editId;

  if (editId) {
    await window._update(window._ref(window._db, 'products/' + editId), { name, imageUrl, affiliateUrl, categoryId });
    showToast('Product updated ✓');
    btn.textContent = 'Add Product';
    delete btn.dataset.editId;
    btn.classList.remove('editing');
  } else {
    const newRef = window._push(window._ref(window._db, 'products'));
    await window._set(newRef, { name, imageUrl, affiliateUrl, categoryId, createdAt: Date.now() });
    showToast('Product added ✓');
  }

  document.getElementById('prodName').value = '';
  document.getElementById('prodImgUrl').value = '';
  document.getElementById('prodLink').value = '';
  document.getElementById('prodCat').value = '';
});

// ── RENDER ADMIN CATS ──
function renderAdminCats() {
  const list = document.getElementById('catList');
  const cats = Object.entries(allCategories);
  cats.sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

  if (cats.length === 0) {
    list.innerHTML = `<p style="color:var(--text-muted);font-size:13px;">No categories yet</p>`;
    return;
  }

  list.innerHTML = cats.map(([id, cat]) => `
    <div class="list-item">
      <span style="font-size:1.3rem">${cat.emoji || '📦'}</span>
      <div class="list-item-info">
        <div class="list-item-name">${cat.name}</div>
        <div class="list-item-sub">${Object.values(allProducts).filter(p => p.categoryId === id).length} products</div>
      </div>
      <div class="list-item-actions">
        <button class="icon-btn edt" title="Edit" onclick="openEditCat('${id}')">✏️</button>
        <button class="icon-btn del" title="Delete" onclick="deleteCat('${id}')">🗑</button>
      </div>
    </div>
  `).join('');
}

// ── RENDER ADMIN PRODS ──
function renderAdminProds() {
  const list = document.getElementById('prodList');
  const prods = Object.entries(allProducts);
  prods.sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

  if (prods.length === 0) {
    list.innerHTML = `<p style="color:var(--text-muted);font-size:13px;">No products yet</p>`;
    return;
  }

  list.innerHTML = prods.map(([id, p]) => {
    const cat = allCategories[p.categoryId];
    return `<div class="list-item">
      <div class="list-item-info">
        <div class="list-item-name">${p.name}</div>
        <div class="list-item-sub">${cat ? (cat.emoji + ' ' + cat.name) : 'No category'}</div>
      </div>
      <div class="list-item-actions">
        <button class="icon-btn edt" title="Edit" onclick="openEditProd('${id}')">✏️</button>
        <button class="icon-btn del" title="Delete" onclick="deleteProd('${id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

// ── POPULATE SELECTS ──
function populateCatSelects() {
  const cats = Object.entries(allCategories);
  cats.sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));
  const opts = cats.map(([id, c]) => `<option value="${id}">${c.emoji || ''} ${c.name}</option>`).join('');

  const sel = document.getElementById('prodCat');
  const val = sel.value;
  sel.innerHTML = '<option value="">— Select category —</option>' + opts;
  if (val) sel.value = val;

  const editSel = document.getElementById('editProdCat');
  const editVal = editSel.value;
  editSel.innerHTML = '<option value="">— Select category —</option>' + opts;
  if (editVal) editSel.value = editVal;
}

// ── DELETE ──
async function deleteCat(id) {
  if (!confirm('Delete this category? Products inside will remain.')) return;
  await window._remove(window._ref(window._db, 'categories/' + id));
  showToast('Category deleted');
}

async function deleteProd(id) {
  if (!confirm('Delete this product?')) return;
  await window._remove(window._ref(window._db, 'products/' + id));
  showToast('Product deleted');
}

// ── EDIT CATEGORY ──
function openEditCat(id) {
  const cat = allCategories[id];
  if (!cat) return;
  document.getElementById('editCatId').value = id;
  document.getElementById('editCatName').value = cat.name;
  document.getElementById('editCatEmoji').value = cat.emoji || '';
  document.getElementById('editCatModal').classList.add('show');
}

document.getElementById('cancelEditCat').addEventListener('click', () => {
  document.getElementById('editCatModal').classList.remove('show');
});

document.getElementById('saveEditCat').addEventListener('click', async () => {
  const id = document.getElementById('editCatId').value;
  const name = document.getElementById('editCatName').value.trim();
  const emoji = document.getElementById('editCatEmoji').value.trim();
  if (!name) { showToast('Enter a name', 'error'); return; }
  await window._update(window._ref(window._db, 'categories/' + id), { name, emoji });
  document.getElementById('editCatModal').classList.remove('show');
  showToast('Category updated ✓');
});

// ── EDIT PRODUCT ──
function openEditProd(id) {
  const p = allProducts[id];
  if (!p) return;
  populateCatSelects();
  document.getElementById('editProdId').value = id;
  document.getElementById('editProdName').value = p.name;
  document.getElementById('editProdImgUrl').value = p.imageUrl || '';
  document.getElementById('editProdLink').value = p.affiliateUrl || '';
  setTimeout(() => { document.getElementById('editProdCat').value = p.categoryId || ''; }, 50);
  document.getElementById('editProdModal').classList.add('show');
}

document.getElementById('cancelEditProd').addEventListener('click', () => {
  document.getElementById('editProdModal').classList.remove('show');
});

document.getElementById('saveEditProd').addEventListener('click', async () => {
  const id = document.getElementById('editProdId').value;
  const name = document.getElementById('editProdName').value.trim();
  const imageUrl = document.getElementById('editProdImgUrl').value.trim();
  const affiliateUrl = document.getElementById('editProdLink').value.trim();
  const categoryId = document.getElementById('editProdCat').value;
  if (!name) { showToast('Enter a name', 'error'); return; }
  if (!affiliateUrl) { showToast('Enter affiliate URL', 'error'); return; }
  if (!categoryId) { showToast('Select a category', 'error'); return; }
  await window._update(window._ref(window._db, 'products/' + id), { name, imageUrl, affiliateUrl, categoryId });
  document.getElementById('editProdModal').classList.remove('show');
  showToast('Product updated ✓');
});

// ── TRACK CLICK ──
async function trackClick(productId) {
  const current = (allClicks[productId] || 0) + 1;
  await window._update(window._ref(window._db, 'clicks'), { [productId]: current });
}

// ── RENDER ANALYTICS ──
function renderAnalytics() {
  const list = document.getElementById('analyticsList');
  if (!list) return;

  const prods = Object.entries(allProducts);
  if (prods.length === 0) {
    list.innerHTML = `<div class="analytics-empty">No products yet</div>`;
    return;
  }

  // merge clicks into products and sort desc
  const ranked = prods
    .map(([id, p]) => ({ id, ...p, clicks: allClicks[id] || 0 }))
    .sort((a, b) => b.clicks - a.clicks);

  const maxClicks = ranked[0].clicks || 1;

  if (ranked.every(p => p.clicks === 0)) {
    list.innerHTML = `<div class="analytics-empty">🖱 No clicks tracked yet.<br>Clicks will appear here when visitors click products.</div>`;
    return;
  }

  list.innerHTML = ranked.map((p, i) => {
    const cat = allCategories[p.categoryId];
    const pct = Math.round((p.clicks / maxClicks) * 100);
    return `<div class="analytics-item">
      <div class="analytics-rank ${i === 0 ? 'top' : ''}">#${i + 1}</div>
      <div class="analytics-info">
        <div class="analytics-name">${p.name}</div>
        <div class="analytics-cat">${cat ? (cat.emoji + ' ' + cat.name) : '—'}</div>
        <div class="analytics-bar-wrap">
          <div class="analytics-bar-bg">
            <div class="analytics-bar-fill" style="width:${pct}%"></div>
          </div>
          <div class="analytics-clicks">${p.clicks} <span>clicks</span></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── RESET CLICKS ──
document.getElementById('resetClicksBtn').addEventListener('click', async () => {
  if (!confirm('Reset ALL click counts to zero?')) return;
  await window._set(window._ref(window._db, 'clicks'), null);
  showToast('Click data reset ✓');
});

// expose for inline onclick
window.goToCategory = goToCategory;
window.deleteCat = deleteCat;
window.deleteProd = deleteProd;
window.openEditCat = openEditCat;
window.openEditProd = openEditProd;
window.trackClick = trackClick;
</script>
</body>
</html>
